name: CI

# 触发时机：推送到主要分支、发起 PR、以及手动触发
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 上避免并行跑多套 CI；关闭 cancel-in-progress，
# 防止连续点「Re-run」把尚在跑的 job 以 SIGTERM(143) 杀掉，造成假失败。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, go${{ matrix.go-version }}, race=${{ matrix.race }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 明确列出组合：Linux + 新版 Go 的 race/TSAN 在 GitHub hosted runner 上
        # 会高频被 SIGTERM(143) 杀掉（PR#67/#68 已验证）；该组合只跑普通测试。
        include:
          - os: ubuntu-24.04
            go-version: '1.18'
            race: '1'
          - os: ubuntu-24.04
            go-version: '1.26.x'
            race: '0'
          - os: windows-2022
            go-version: '1.18'
            race: '1'
          - os: windows-2022
            go-version: '1.26.x'
            race: '0'
    env:
      CGO_ENABLED: ${{ matrix.race == '1' && '1' || '0' }}
      # 进一步限制 race 任务的 CPU，降低 TSAN 内存峰值
      GOMAXPROCS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Install MinGW-w64 gcc (Windows, for -race/cgo)
        if: runner.os == 'Windows' && matrix.race == '1'
        run: choco install mingw -y --no-progress

      - name: Show environment
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOMAXPROCS

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        if: matrix.race != '1'
        run: go test -count=1 -p 1 -timeout 10m ./...

      - name: Test (with race detector)
        if: matrix.race == '1'
        env:
          GOMEMLIMIT: 2GiB
        run: go test -race -count=1 -p 1 -parallel 1 -timeout 15m ./...
